train:
  num_micro_batches: 4
  lr: 0.001
  patience: 100
  weight_decay: 4.4e-07
  grad_clip: 0.65
  max_epochs: 100
  device: cuda
  ckpt: '/home/jan/projects/CIIRC/column generation/CG_GNN/outputs/2024-12-31/20-29-15/trained_model.ckpt'
  resume: false
loss:
  loss: primal+constraint
  loss_weight_cons: 2.0
  loss_weight_obj: 0.33
  loss_weight_x: 1.0
  losstype: l2
  
model:  
  params:
    num_classes: 2
    in_shape: 2
    lappe: 0
    num_val_iters: 100
    num_train_iters: 20
    conv: gcnconv
    conv_sequence: cov
    dropout: 0.0
    hidden: 64
    num_conv_layers: 25
    num_mlp_layers: 2
    num_pred_layers: 1  
    share_conv_weight: true
    share_lin_weight: false
    use_norm: true
    use_res: true 
  
data:
  task: 'sub' # rmp, sub
  datapath: '/home/jan/projects/CIIRC/column generation/IPM_MPNN/fac6/MWISP_instances_300nodes_0.15density/${data.task}' #'/home/jan/projects/CIIRC/column generation/IPM_MPNN/fac6/knapsack/'
  num_workers: 4
  batch_size: 12
  num_val_examples: 500
  train_proportion: 0.9

other:
  use_wandb: false
  wandbproject: cg_gnn
  ipm_alpha: 0.76
  ipm_restarts: 1
  ipm_steps: 8
  upper: 1.0
eval:
  ckpt: '/home/jan/projects/CIIRC/column generation/CG_GNN/temp/checkpoints/rmp/trained_model.ckpt'
